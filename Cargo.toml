[package]
name = "msm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MSN-Messenger-style desktop client for Matrix"

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eyeball = "0.8.8"
futures-util = "0.3.34"
getrandom = "0.4.3"
gtk = "0.19"
ksni = "0.3.6"
libc = "0.2.191"
matrix-sdk = { version = "0.19", features = ["qrcode", "sso-login"] }
mime_guess = "2.0.5"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
opus = "0.4.0"
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.11.0"
rtc = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
webrtc = "0.21.1"

[dev-dependencies]
async-channel = "2.5.0"

[package.metadata.deb]
maintainer = "James Carthew <jcarthew@gmail.com>"
copyright = "2026, James Carthew"
license-file = ["COPYING", "0"]
extended-description = "An MSN-Messenger-style desktop client for Matrix (GTK3, matrix-rust-sdk) with private contact nicknames, groups, presence, end-to-end encryption and calendar invitations."
section = "net"
priority = "optional"
depends = "$auto"
recommends = "gnome-keyring | kwalletd5 | kwalletd6, ffmpeg, pulseaudio-utils"
assets = [
    ["target/release/msm", "usr/bin/", "755"],
    ["data/com.matrixmessenger.Msm.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/com.matrixmessenger.Msm.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/msm/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/msm", dest = "/usr/bin/msm", mode = "755" },
    { source = "data/com.matrixmessenger.Msm.desktop", dest = "/usr/share/applications/com.matrixmessenger.Msm.desktop", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/com.matrixmessenger.Msm.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.matrixmessenger.Msm.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/msm/README.md", mode = "644", doc = true },
    { source = "COPYING", dest = "/usr/share/licenses/msm/COPYING", mode = "644", license = true },
]

[package.metadata.generate-rpm.requires]
gtk3 = "*"
