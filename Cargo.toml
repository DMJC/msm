[package]
name = "msm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
directories = "6.0.0"
getrandom = "0.4.3"
gtk = "0.19"
matrix-sdk = "0.19"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
async-channel = "2.5.0"
